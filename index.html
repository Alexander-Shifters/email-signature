<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Shifters AI Email Signature Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f3f5f7;
      color: #182c4c;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #182c4c;
    }

    .header p {
      margin: 0;
      color: #58718a;
      font-size: 15px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #d9e0e6;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 18px rgba(24, 44, 76, 0.08);
    }

    .panel h2 {
      margin: 0 0 20px;
      font-size: 18px;
      color: #182c4c;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #182c4c;
    }

    .field input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #bcc8d2;
      border-radius: 6px;
      font-size: 14px;
      color: #182c4c;
      background: #ffffff;
    }

    .field input:focus {
      outline: 2px solid rgba(251, 60, 6, 0.2);
      border-color: #fb3c06;
    }

    .copy-button {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      border: 0;
      border-radius: 6px;
      background: #fb3c06;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .copy-button:hover {
      background: #dc3505;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #58718a;
    }

    .preview-area {
      min-height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        repeating-linear-gradient(
          45deg,
          #f4f6f8,
          #f4f6f8 10px,
          #eef1f4 10px,
          #eef1f4 20px
        ) border-box;
    }

    .signature-wrapper {
      padding: 30px;
      background: #ffffff;
    }

    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>Shifters AI Email Signature Generator</h1>
      <p>
        Enter your details, review the preview, and copy the
        completed signature into Gmail.
      </p>
    </header>

    <section class="workspace">
      <div class="panel">
        <h2>Employee details</h2>

        <div class="field">
          <label for="employeeName">Full name</label>
          <input
            id="employeeName"
            type="text"
            value="Liran Antebi Ph.D."
          >
        </div>

        <div class="field">
          <label for="employeeTitle">Position</label>
          <input
            id="employeeTitle"
            type="text"
            value="VP AI Policy and Strategy"
          >
        </div>

        <div class="field">
          <label for="employeePhone">Phone number</label>
          <input
            id="employeePhone"
            type="text"
            value="+972-52-4239058"
          >
        </div>

        <div class="field">
          <label for="employeeEmail">Email address</label>
          <input
            id="employeeEmail"
            type="email"
            value="liran@shifters-ai.com"
          >
        </div>

        <button
          class="copy-button"
          type="button"
          onclick="copySignature()"
        >
          Copy signature
        </button>

        <div class="status" id="status"></div>
      </div>

      <div class="panel">
        <h2>Signature preview</h2>

        <div class="preview-area">
          <div class="signature-wrapper">
            <div id="signaturePreview"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const fields = {
      name: document.getElementById("employeeName"),
      title: document.getElementById("employeeTitle"),
      phone: document.getElementById("employeePhone"),
      email: document.getElementById("employeeEmail")
    };

    const preview = document.getElementById("signaturePreview");
    const statusMessage = document.getElementById("status");

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getAssetUrl(filename) {
      return new URL(filename, window.location.href).href;
    }

    function getSignatureHtml() {
      const name = escapeHtml(fields.name.value.trim());
      const title = escapeHtml(fields.title.value.trim());
      const phone = escapeHtml(fields.phone.value.trim());
      const email = escapeHtml(fields.email.value.trim());

      const phoneLink = fields.phone.value.replace(
        /[^+\d]/g,
        ""
      );

      const logoUrl = getAssetUrl(
        "Shifters%20logo%20silver.png"
      );

      const phoneIcon = getAssetUrl("icon-phone.png");
      const emailIcon = getAssetUrl("icon-email.png");
      const webIcon = getAssetUrl("icon-web.png");

      return `
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="
    width:520px;
    border-collapse:collapse;
    font-family:Arial,Helvetica,sans-serif;
    color:#182c4c;
  "
>
  <tr>
    <td
      rowspan="5"
      valign="middle"
      style="
        width:130px;
        padding:0 18px 0 0;
        border-right:2px solid #fb3c06;
        text-align:center;
      "
    >
      <img
        src="${logoUrl}"
        width="112"
        alt="Shifters AI"
        style="
          display:block;
          width:112px;
          height:auto;
          border:0;
          margin:0 auto;
        "
      >
    </td>

    <td
      style="
        padding:0 0 2px 14px;
        font-size:14px;
        line-height:17px;
        font-weight:700;
        color:#000000;
      "
    >
      ${name}
    </td>
  </tr>

  <tr>
    <td
      style="
        padding:0 0 10px 14px;
        font-size:12px;
        line-height:15px;
        color:#58718a;
      "
    >
      ${title}
    </td>
  </tr>

  <tr>
    <td
      style="
        padding:0 0 10px 14px;
        font-size:16px;
        line-height:19px;
        font-weight:700;
        letter-spacing:5px;
        color:#fb3c06;
      "
    >
      SHIFTERS
    </td>
  </tr>

  <tr>
    <td
      style="
        padding:0 0 8px 14px;
        white-space:nowrap;
        font-size:11px;
        line-height:15px;
        color:#182c4c;
      "
    >
      <img
        src="${phoneIcon}"
        width="12"
        height="12"
        alt=""
        style="
          display:inline-block;
          vertical-align:-2px;
          width:12px;
          height:12px;
          border:0;
          margin-right:4px;
        "
      >
      <a
        href="tel:${phoneLink}"
        style="
          color:#182c4c;
          text-decoration:none;
        "
      >${phone}</a>

      <span style="display:inline-block;width:12px;"></span>

      <img
        src="${emailIcon}"
        width="12"
        height="12"
        alt=""
        style="
          display:inline-block;
          vertical-align:-2px;
          width:12px;
          height:12px;
          border:0;
          margin-right:4px;
        "
      >
      <a
        href="mailto:${email}"
        style="
          color:#182c4c;
          text-decoration:none;
        "
      >${email}</a>

      <span style="display:inline-block;width:12px;"></span>

      <img
        src="${webIcon}"
        width="12"
        height="12"
        alt=""
        style="
          display:inline-block;
          vertical-align:-2px;
          width:12px;
          height:12px;
          border:0;
          margin-right:4px;
        "
      >
      <a
        href="https://www.shiftersai.com"
        style="
          color:#182c4c;
          text-decoration:none;
        "
      >www.shiftersai.com</a>
    </td>
  </tr>

  <tr>
    <td
      style="
        padding:7px 0 0 14px;
        border-top:1px solid #9ba9b5;
        font-size:11px;
        line-height:14px;
        letter-spacing:5px;
        color:#fb3c06;
      "
    >
      ROBOTS GO FIRST.
    </td>
  </tr>
</table>
      `;
    }

    function updatePreview() {
      preview.innerHTML = getSignatureHtml();
      statusMessage.textContent = "";
    }

    Object.values(fields).forEach((field) => {
      field.addEventListener("input", updatePreview);
    });

    async function copySignature() {
      const html = getSignatureHtml();
      const plainText =
        `${fields.name.value}\n` +
        `${fields.title.value}\n` +
        `SHIFTERS\n` +
        `${fields.phone.value} | ` +
        `${fields.email.value} | ` +
        `www.shiftersai.com\n` +
        `ROBOTS GO FIRST.`;

      try {
        if (
          navigator.clipboard &&
          window.ClipboardItem
        ) {
          const clipboardItem = new ClipboardItem({
            "text/html": new Blob(
              [html],
              { type: "text/html" }
            ),
            "text/plain": new Blob(
              [plainText],
              { type: "text/plain" }
            )
          });

          await navigator.clipboard.write([
            clipboardItem
          ]);
        } else {
          const temporary = document.createElement("div");
          temporary.innerHTML = html;
          temporary.style.position = "fixed";
          temporary.style.left = "-9999px";
          document.body.appendChild(temporary);

          const range = document.createRange();
          range.selectNodeContents(temporary);

          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);

          document.execCommand("copy");
          selection.removeAllRanges();
          temporary.remove();
        }

        statusMessage.textContent =
          "Signature copied. Paste it into Gmail.";
      } catch (error) {
        statusMessage.textContent =
          "Copy failed. Please try again.";
      }
    }

    updatePreview();
  </script>
</body>
</html>
