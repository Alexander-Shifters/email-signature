<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Shifters AI Email Signature Generator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 36px 20px;
      background: #f4f6f8;
      color: #182c4c;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
    }

    .header { margin-bottom: 24px; }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 34px;
    }

    .header p {
      margin: 0;
      color: #58718a;
      font-size: 15px;
      line-height: 22px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #d7dfe6;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 6px 18px rgba(24, 44, 76, 0.08);
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 18px;
      line-height: 24px;
    }

    .field { margin-bottom: 15px; }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #b9c5cf;
      border-radius: 6px;
      background: #ffffff;
      color: #182c4c;
      font-size: 14px;
    }

    .field input:focus {
      outline: 2px solid rgba(251, 60, 6, 0.18);
      border-color: #fb3c06;
    }

    .copy-button {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      border: 0;
      border-radius: 6px;
      background: #fb3c06;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .copy-button:hover { background: #dc3505; }

    .status {
      min-height: 20px;
      margin-top: 12px;
      color: #58718a;
      text-align: center;
      font-size: 13px;
    }

    .preview-box {
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
      padding: 28px;
      background: #f8fafb;
      border: 1px dashed #c8d1d9;
      border-radius: 8px;
    }

    .signature-stage {
      padding: 20px;
      background: #ffffff;
    }

    .instructions {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #e1e6ea;
      color: #58718a;
      font-size: 13px;
      line-height: 19px;
    }

    .version {
      margin-top: 10px;
      color: #8a99a8;
      font-size: 11px;
      text-align: right;
    }

    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>Shifters AI Email Signature Generator</h1>
      <p>
        Enter your details, review the signature, and copy it
        directly into Gmail.
      </p>
    </header>

    <section class="workspace">
      <div class="panel">
        <h2>Employee details</h2>

        <div class="field">
          <label for="employeeName">Full name</label>
          <input id="employeeName" type="text" value="Liran Antebi Ph.D.">
        </div>

        <div class="field">
          <label for="employeeTitle">Position</label>
          <input id="employeeTitle" type="text" value="VP AI Policy and Strategy">
        </div>

        <div class="field">
          <label for="employeePhone">Phone number</label>
          <input id="employeePhone" type="text" value="+972-52-4239058">
        </div>

        <div class="field">
          <label for="employeeEmail">Email address</label>
          <input id="employeeEmail" type="email" value="liran@shifters-ai.com">
        </div>

        <button
          class="copy-button"
          type="button"
          onclick="copySignature()"
        >
          Copy signature for Gmail
        </button>

        <div class="status" id="status"></div>
      </div>

      <div class="panel">
        <h2>Signature preview</h2>

        <div class="preview-box">
          <div class="signature-stage">
            <div id="signaturePreview"></div>
          </div>
        </div>

        <div class="instructions">
          The preview updates automatically. The final signature
          uses Gmail-safe table formatting and standard email fonts.
        </div>

        <div class="version">Version 1.0.0</div>
      </div>
    </section>
  </main>

  <script>
    const fields = {
      name: document.getElementById("employeeName"),
      title: document.getElementById("employeeTitle"),
      phone: document.getElementById("employeePhone"),
      email: document.getElementById("employeeEmail")
    };

    const preview = document.getElementById("signaturePreview");
    const status = document.getElementById("status");

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function assetUrl(filename) {
      return new URL(filename, window.location.href).href;
    }

    function signatureHtml() {
      const name = escapeHtml(fields.name.value.trim());
      const title = escapeHtml(fields.title.value.trim());
      const phone = escapeHtml(fields.phone.value.trim());
      const email = escapeHtml(fields.email.value.trim());

      const telephoneHref = fields.phone.value.replace(/[^+\d]/g, "");

      const logo = assetUrl("Shifters%20logo%20silver.png");
      const phoneIcon = assetUrl("icon-phone.svg");
      const emailIcon = assetUrl("icon-mail.svg");
      const webIcon = assetUrl("icon-web.svg");

      return `
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="
    width:560px;
    border-collapse:collapse;
    table-layout:fixed;
    font-family:Arial,Helvetica,sans-serif;
    color:#182c4c;
  "
>
  <tr>
    <td
      rowspan="5"
      width="142"
      valign="middle"
      style="
        width:142px;
        padding:0 16px 0 0;
        border-right:2px solid #fb3c06;
        text-align:center;
      "
    >
      <img
        src="${logo}"
        width="132"
        alt="Shifters AI"
        style="
          display:block;
          width:132px;
          height:auto;
          margin:0 auto;
          border:0;
        "
      >
    </td>

    <td
      style="
        padding:0 0 6px 14px;
        font-size:15px;
        line-height:18px;
        font-weight:700;
        color:#000000;
      "
    >
      ${name}
    </td>
  </tr>

  <tr>
    <td
      style="
        padding:0 0 6px 14px;
        font-size:11px;
        line-height:16px;
        color:#58718a;
      "
    >
      ${title}
    </td>
  </tr>

  <tr>
    <td
      style="
        padding:0 0 6px 14px;
        font-size:15px;
        line-height:18px;
        font-weight:700;
        letter-spacing:4px;
        color:#fb3c06;
      "
    >
      SHIFTERS
    </td>
  </tr>

  <tr>
    <td
      style="
        padding:0 0 6px 14px;
        white-space:nowrap;
        font-size:10px;
        line-height:16px;
        color:#182c4c;
      "
    >
      <img
        src="${phoneIcon}"
        width="16"
        height="16"
        alt=""
        style="
          display:inline-block;
          width:16px;
          height:16px;
          margin:0 3px 0 0;
          border:0;
          vertical-align:-3px;
        "
      >
      <a
        href="tel:${telephoneHref}"
        style="color:#182c4c;text-decoration:none;"
      >${phone}</a>

      <span style="display:inline-block;width:10px;"></span>

      <img
        src="${emailIcon}"
        width="16"
        height="16"
        alt=""
        style="
          display:inline-block;
          width:16px;
          height:16px;
          margin:0 3px 0 0;
          border:0;
          vertical-align:-3px;
        "
      >
      <a
        href="mailto:${email}"
        style="color:#182c4c;text-decoration:none;"
      >${email}</a>

      <span style="display:inline-block;width:10px;"></span>

      <img
        src="${webIcon}"
        width="16"
        height="16"
        alt=""
        style="
          display:inline-block;
          width:16px;
          height:16px;
          margin:0 3px 0 0;
          border:0;
          vertical-align:-3px;
        "
      >
      <a
        href="https://www.shiftersai.com"
        style="color:#182c4c;text-decoration:none;"
      >www.shiftersai.com</a>
    </td>
  </tr>

  <tr>
  <td
    style="
      padding:0 0 1px 14px;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="354"
      style="
        width:354px;
        border-collapse:collapse;
      "
    >
      <tr>
        <td
          style="
            padding:6px 0 0 0;
            border-top:1px solid #7f90a3;
            font-size:10px;
            line-height:13px;
            letter-spacing:4px;
            color:#fb3c06;
          "
        >
          ROBOTS GO FIRST.
        </td>
      </tr>
    </table>
  </td>
</tr>
  </tr>
</table>
      `;
    }

    function updatePreview() {
      preview.innerHTML = signatureHtml();
      status.textContent = "";
    }

    Object.values(fields).forEach((field) => {
      field.addEventListener("input", updatePreview);
    });

    async function copySignature() {
      const html = signatureHtml();

      const plainText =
        `${fields.name.value}\n` +
        `${fields.title.value}\n` +
        `SHIFTERS\n` +
        `${fields.phone.value} | ` +
        `${fields.email.value} | ` +
        `www.shiftersai.com\n` +
        `ROBOTS GO FIRST.`;

      try {
        if (navigator.clipboard && window.ClipboardItem) {
          const item = new ClipboardItem({
            "text/html": new Blob([html], { type: "text/html" }),
            "text/plain": new Blob([plainText], { type: "text/plain" })
          });

          await navigator.clipboard.write([item]);
        } else {
          const temporary = document.createElement("div");
          temporary.innerHTML = html;
          temporary.style.position = "fixed";
          temporary.style.left = "-9999px";
          document.body.appendChild(temporary);

          const range = document.createRange();
          range.selectNodeContents(temporary);

          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);

          document.execCommand("copy");

          selection.removeAllRanges();
          temporary.remove();
        }

        status.textContent =
          "Signature copied. Paste it into Gmail.";
      } catch (error) {
        status.textContent =
          "Copy failed. Please try again.";
      }
    }

    updatePreview();
  </script>
</body>
</html>
